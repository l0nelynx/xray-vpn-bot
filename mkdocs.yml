site_name: XRAY VPN Bot
site_description: Documentation for the Telegram VPN subscription suite (Remnawave, MiniApp, Dashboard, Android).
site_url: https://l0nelynx.github.io/xray-vpn-bot/docs/

repo_name: l0nelynx/xray-vpn-bot
repo_url: https://github.com/l0nelynx/xray-vpn-bot
edit_uri: edit/develop/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: README.md
  - Getting started:
      - Overview: getting-started.md
      - Deployment: deployment.md
      - Configuration: configuration.md
      - Local development: local-development.md
  - Architecture: architecture.md
  - Components:
      - Seller bot: seller-bot.md
      - Dashboard: dashboard.md
      - MiniApp: miniapp.md
      - Web portal: web-portal.md
      - Android API: android-api.md
  - Growth:
      - CRM: crm.md
      - Referral & promocodes: referral.md
  - Payments:
      - Payment gateways: payment-gateways.md
  - Operations:
      - Database: database.md
      - Integrations: integrations.md
      - Remnawave 2.8 ID backfill: remnawave-v3-id-backfill.md
      - Remnawave v3 rollout: remnawave-v3-rollout.md
      - Connect page: connect-page.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/l0nelynx/xray-vpn-bot
