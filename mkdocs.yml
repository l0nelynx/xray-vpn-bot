site_name: XRAY VPN Bot
site_description: Documentation for the Telegram VPN subscription suite (Remnawave, MiniApp, Dashboard, Android).
site_url: https://l0nelynx.github.io/xray-vpn-bot/

repo_name: l0nelynx/xray-vpn-bot
repo_url: https://github.com/l0nelynx/xray-vpn-bot
edit_uri: edit/develop/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: README.md
  - Getting started:
      - Deployment: deployment.md
      - Architecture: architecture.md
  - Platform:
      - Database: database.md
      - Integrations: integrations.md
  - Clients:
      - Android API: android-api.md
      - Web portal: web-portal.md
      - Connect page: connect-page.md
  - Development:
      - Promo system reference: claude.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/l0nelynx/xray-vpn-bot
