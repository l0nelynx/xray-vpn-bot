# Reverse proxy + static host for the XRAY-VPN web tier.
#
# This container bakes in the built dashboard and miniapp SPAs and serves them,
# while proxying API + webhook traffic to the backend service containers over
# the shared docker network. It is the single web upstream — the edge nginx
# (TLS/domain termination) only needs to proxy everything to `frontend:80`.
#
# URL map (all API endpoints live under .../api, so the split is unambiguous):
#   /bot/dashboard/api/  -> dashboard:8000   (admin API)
#   /bot/dashboard/      -> dashboard SPA static (+ SPA fallback)
#   /bot/miniapp/api/    -> miniapp:8001     (miniapp / web portal / android API)
#   /bot/miniapp/        -> miniapp SPA static (+ SPA fallback)
#   /bot/                -> bot:5000         (payment webhooks: /bot/*_webhook)
#   /                    -> miniapp SPA      (public web portal entry)

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend containers, resolved via docker DNS on the shared network.
    upstream dashboard_api { server dashboard:8000; }
    upstream miniapp_api   { server miniapp:8001; }
    upstream bot_api       { server bot:5000; }

    # Reusable proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # --- APIs (longest-prefix match wins, so these beat the SPA blocks) ---
        location /bot/dashboard/api/ {
            proxy_pass http://dashboard_api;
        }
        location /bot/miniapp/api/ {
            proxy_pass http://miniapp_api;
        }

        # --- Dashboard SPA ---
        location /bot/dashboard/ {
            try_files $uri /bot/dashboard/index.html;
        }

        # --- MiniApp SPA ---
        location /bot/miniapp/ {
            try_files $uri /bot/miniapp/index.html;
        }

        # --- Payment webhooks and any other bot endpoints ---
        #     (/bot/dashboard* and /bot/miniapp* are handled above by their
        #     longer-prefix locations; everything else under /bot/ is the bot.)
        location /bot/ {
            proxy_pass http://bot_api;
        }

        # --- Public web portal entry -> miniapp SPA ---
        location / {
            try_files $uri /bot/miniapp/index.html;
        }
    }
}
