# Static host for the XRAY-VPN web tier.
#
# This container ONLY serves the built dashboard and miniapp SPAs. All routing
# (static vs API vs webhooks) is owned by the edge nginx, which proxies static
# requests here and API/webhook requests directly to the backend containers.
# See the "Web tier & reverse proxy" section in README.md for the edge config.
#
# Served paths:
#   /bot/dashboard/  -> dashboard SPA (+ SPA fallback)
#   /bot/miniapp/    -> miniapp SPA   (+ SPA fallback)
#   /                -> miniapp SPA   (public web portal entry)

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        location /bot/dashboard/ {
            try_files $uri /bot/dashboard/index.html;
        }

        location /bot/miniapp/ {
            try_files $uri /bot/miniapp/index.html;
        }

        location / {
            try_files $uri /bot/miniapp/index.html;
        }
    }
}
