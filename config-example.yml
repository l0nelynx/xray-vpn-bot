# Telegram VPN Bot — Configuration Template
# Copy to config.yml and fill in your values. Never commit config.yml to git.
# Shared by all backends: bot, support-bot, dashboard, miniapp.
#
# Required keys are marked [REQUIRED]. Keys with defaults are marked [optional].
# Operator-facing settings are preferred in Dashboard (dual-source: DB wins after Save).


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  CORE BOT IDENTITY                                                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

branding_name: "YourVPN"                           # preferred: Dashboard → Settings → Runtime
token: "yourbottoken"                              # [REQUIRED] Main user-facing Telegram bot token (bootstrap — stays in YAML)
bot_url: "https://t.me/YourBot"                   # [REQUIRED] Direct t.me link to your bot (used in notifications)
miniapp_url: "https://example.com/bot/miniapp"    # [REQUIRED] Direct HTTPS URL of the MiniApp web page — used inside WebApp button (must be HTTPS, reachable by Telegram)
miniapp_tg_url: "https://t.me/YourBot/appname"    # [REQUIRED] Telegram-side link to the MiniApp — register the app name in BotFather, then use https://t.me/YourBot/appname. Shown as a clickable link in bot messages.


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  CHANNELS & PUBLIC LINKS  (preferred: Dashboard → Settings → Runtime)       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

news_id: -1001234567890                            # preferred: Dashboard Runtime — News/announcements channel numeric ID
news_url: "https://t.me/YourNewsChannel"           # preferred: Dashboard Runtime — Public invite link
support_bot_id: "@YourSupportBot"                  # preferred: Dashboard Runtime — Support contact
agreement_url: "https://example.com/agreement"    # preferred: Dashboard Runtime
policy_url: "https://example.com/policy"          # preferred: Dashboard Runtime


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ADMIN & NOTIFICATIONS                                                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

admin_id: 123456789                                # [REQUIRED] Admin Telegram user ID (bootstrap)
admin_bot_token: "youradminbottoken"               # [optional] Separate admin bot token; omit to disable
logs_id: -1001234567890                            # preferred: Dashboard Runtime — event log chat/channel
web_id: -1001234567890                              # preferred: Dashboard Runtime — web-portal inquiries chat
admin_logs_length: 20                              # preferred: Dashboard Runtime — in-bot admin log rows


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  LOGGING                                                                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# Miniapp service log verbosity. Default: normal (= INFO).
# Accepted: normal | debug | warning | error | critical
# log_level: normal


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  WEBHOOK SERVER (bot)                                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

uvicorn_host: "0.0.0.0"                            # [optional] Uvicorn bind host (default: 0.0.0.0)
uvicorn_port: 5000                                 # [optional] Uvicorn bind port (default: 5000)
# SSL is terminated upstream (nginx/Caddy). The lines below are intentionally disabled:
# uvicorn_ssl_key: "./uvicorn/ssl/key.pem"
# uvicorn_ssl_cert: "./uvicorn/ssl/fullchain.pem"


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  REMNAWAVE VPN PANEL                                                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

remnawave_url: "https://panel.example.com"         # [REQUIRED] Remnawave panel base URL (bootstrap)
remnawave_token: "your-remnawave-api-token"        # [REQUIRED] Remnawave API token (bootstrap)
remnawave_webhook_secret: "your-webhook-secret-here"  # [optional] HMAC secret for inbound panel webhooks (bootstrap)

# Squad UUIDs — preferred: Dashboard → Settings → Remnawave
rw_free_id: "uuid-of-free-squad"                   # preferred: Dashboard Remnawave — Internal squad for FREE plan users
rw_pro_id: "uuid-of-pro-squad"                     # preferred: Dashboard Remnawave — Internal squad for PRO plan users
rw_ext_free_id: "uuid-of-ext-free-squad"           # preferred: Dashboard Remnawave — External squad for FREE users
rw_ext_pro_id: "uuid-of-ext-pro-squad"             # preferred: Dashboard Remnawave — External squad for PRO users

subscription_url: "https://sub.example.com"        # preferred: Dashboard Remnawave — Base URL for subscription links (Android deep-links)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  DASHBOARD (admin web UI)                                                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

dashboard_login: admin                             # [REQUIRED] Dashboard admin login
dashboard_password: change-me                      # [REQUIRED] Admin password — must NOT be empty or "admin" (boot refuses)
# JWT signing secret. The dashboard REFUSES TO START if this is unset, equal to
# the old built-in default, or shorter than 32 bytes — anyone with a known secret
# can forge admin tokens. Generate one with:  openssl rand -hex 32
dashboard_secret: change-me-to-a-random-string-of-at-least-32-bytes

# Encrypts payment_integrations / app_integrations credentials stored in Postgres.
# Optional: if unset, dashboard_secret is used as a fallback during the dual-source period.
# Generate: openssl rand -hex 32
# payments_secrets_key: change-me-payments-encryption-key-at-least-32-bytes

# Serve Swagger UI (/api/docs) + openapi.json on the dashboard AND miniapp APIs.
# Keep false in production — when true the full API surface (incl. admin/IAP
# routes) is publicly enumerable. Can also be toggled with env EXPOSE_API_DOCS=1.
expose_api_docs: false


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  TELEMT (preferred: Dashboard → Telemt → Connection)                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

telemt_server: "https://telemt.example.com"        # preferred: Dashboard Telemt Connection
telemt_header: "your-telemt-auth-header"           # preferred: Dashboard Telemt Connection (encrypted)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  FREE PLAN  (preferred: Dashboard → Settings → Runtime)                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

free_days: 30                                      # preferred: Dashboard Runtime — Free plan duration in days
free_traffic: 10                                   # preferred: Dashboard Runtime — Free plan traffic limit in GB


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ANDROID / MOBILE APP  (preferred: Dashboard → Settings → Android)          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

android_jwt_secret: "change-me-android-jwt-secret" # preferred: Dashboard Android (encrypted)
# android_access_ttl: 900                          # preferred: Dashboard Android (default: 900)
# android_refresh_ttl: 5184000                     # preferred: Dashboard Android (default: 5184000)
# android_jwt_issuer: "xray-vpn-bot"               # preferred: Dashboard Android


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  EMAIL (preferred: Dashboard → Settings → Email)                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

smtp_host: "smtp.example.com"                      # preferred: Dashboard Email
smtp_port: 587                                     # preferred: Dashboard Email
smtp_user: "noreply@example.com"                   # preferred: Dashboard Email
smtp_password: "your-smtp-password"                # preferred: Dashboard Email (encrypted)
# smtp_from: "YourVPN <noreply@example.com>"       # preferred: Dashboard Email
# smtp_use_tls: false                              # preferred: Dashboard Email
# email_code_ttl: 900                              # preferred: Dashboard Email
# email_code_max_attempts: 5                       # preferred: Dashboard Email


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  GOOGLE PLAY / FCM  (preferred: Dashboard → Settings → Push / Play)         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# Leave blank / omit to disable. Prefer pasting SA JSON in Dashboard (encrypted).
# Paths below remain a bootstrap fallback when Dashboard JSON is empty.
google_play_package_name: ""                       # preferred: Dashboard Push/Play
google_play_service_account_path: ""               # bootstrap fallback path to SA JSON file
google_play_rtdn_token: ""                         # preferred: Dashboard Push/Play (encrypted)

fcm_project_id: ""                                 # preferred: Dashboard Push/Play
fcm_service_account_path: "/app/fcm-sa.json"       # bootstrap fallback path (compose volume)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  WEB PORTAL (preferred: Dashboard → Settings → Web)                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# web_allowed_origins:
#   - https://web.yourdomain.com

# Exact callback allowlist for the Remnawave subscription-page account BFF.
# subscription_page_oauth_redirect_uris:
#   - https://sub.yourdomain.com/_account/callback
# web_portal_url: "https://web.yourdomain.com"

tg_client_secret: ""                               # preferred: Dashboard Web (encrypted)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  SUPPORT BOT (legacy standalone bot — support.py)                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

support_token: "yoursupportbottoken"               # [optional] Token for the legacy support.py bot; omit if not using it


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PAYMENT GATEWAYS  (preferred: Dashboard → Settings → Payments)             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# YAML remains a fallback until you save a provider in the Dashboard (then DB wins).

# --- TELEGRAM STARS + CRYPTOBOT ---
crypto_bot_token: "your_cryptobot_api_token"       # preferred: Dashboard Payments → crypto

# --- CRYSTAL PAY ---
crystal_login: "your_crystal_login"
crystal_secret: "your_crystal_secret"
crystal_salt: "your_crystal_salt"
crystal_webhook: "https://example.com:5000/crystal_webhook"

# --- A-PAYS (SBP) ---
apay_id: 1234
apay_secret: "your_apay_secret"
apay_api_url: "https://apays.io"

# --- PLATEGA ---
platega_merchant_id: "your-platega-merchant-uuid"
platega_api_key: "your_platega_api_key"
platega_url: "https://app.platega.io"
platega_payment_method: 2

# --- PARITYPAY ---
paritypay_shop_id: "your-paritypay-shop-uuid"
paritypay_secret_1: "your_paritypay_secret_key_1"
paritypay_secret_2: "your_paritypay_secret_key_2"
paritypay_url: "https://api.paritypay.ru"
paritypay_webhook: ""
paritypay_service: "sbp"


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  STORE (preferred: Dashboard → Settings → Store)                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

