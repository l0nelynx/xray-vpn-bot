# Telegram VPN Bot — Configuration Template
# Copy to config.yml and fill in your values. Never commit config.yml to git.
# Shared by all four services: seller-bot, support-bot, dashboard, miniapp.
#
# Required keys are marked [REQUIRED]. Keys with defaults are marked [optional].
# Only fill in the payment gateway blocks you actually use.


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  CORE BOT IDENTITY                                                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

branding_name: "YourVPN"                           # [REQUIRED] Service name shown to users in bot/portal
token: "yourbottoken"                              # [REQUIRED] Main user-facing Telegram bot token
bot_url: "https://t.me/YourBot"                   # [REQUIRED] Direct t.me link to your bot (used in notifications)
miniapp_url: "https://example.com/bot/miniapp"    # [REQUIRED] Direct HTTPS URL of the MiniApp web page — used inside WebApp button (must be HTTPS, reachable by Telegram)
miniapp_tg_url: "https://t.me/YourBot/appname"    # [REQUIRED] Telegram-side link to the MiniApp — register the app name in BotFather, then use https://t.me/YourBot/appname. Shown as a clickable link in bot messages.


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  CHANNELS & PUBLIC LINKS                                                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

news_id: -1001234567890                            # [REQUIRED] News/announcements channel — numeric ID (the bot must be admin there)
news_url: "https://t.me/YourNewsChannel"           # [REQUIRED] Public invite link to the news channel (shown to users)
support_bot_id: "@YourSupportBot"                  # [REQUIRED] Support contact shown in bot menus (e.g. @BotUsername or https://t.me/…)
agreement_url: "https://example.com/agreement"    # [REQUIRED] User agreement page URL
policy_url: "https://example.com/policy"          # [REQUIRED] Privacy policy page URL


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ADMIN & NOTIFICATIONS                                                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

admin_id: 123456789                                # [REQUIRED] Admin Telegram user ID (can use bot admin commands)
admin_bot_token: "youradminbottoken"               # [optional] Separate admin bot token for broadcasts/log alerts; omit to disable
logs_id: -1001234567890                            # [optional] Chat/channel ID for event log messages (registrations, invoices, deliveries). Omit → silent.
web_id: -1001234567890                              # [optional] Chat/channel ID for web-portal partnership inquiries. Omit → silent.
admin_logs_length: 20                              # [optional] Rows shown in the in-bot admin log panel (default: 20)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  WEBHOOK SERVER (seller-bot)                                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

uvicorn_host: "0.0.0.0"                            # [optional] Uvicorn bind host (default: 0.0.0.0)
uvicorn_port: 5000                                 # [optional] Uvicorn bind port (default: 5000)
# SSL is terminated upstream (nginx/Caddy). The lines below are intentionally disabled:
# uvicorn_ssl_key: "./uvicorn/ssl/key.pem"
# uvicorn_ssl_cert: "./uvicorn/ssl/fullchain.pem"


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  REMNAWAVE VPN PANEL                                                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

remnawave_url: "https://panel.example.com"         # [REQUIRED] Remnawave panel base URL
remnawave_token: "your-remnawave-api-token"        # [REQUIRED] Remnawave API token (long-lived JWT from panel settings)
remnawave_webhook_secret: "your-webhook-secret-here"  # [optional] HMAC secret for inbound panel webhooks; must match panel WEBHOOK_SECRET_HEADER (a-z, A-Z, 0-9 only). Generate: python -c "import secrets; print(secrets.token_hex(32))"

# Squad UUIDs — find in Remnawave panel → Squads
rw_free_id: "uuid-of-free-squad"                   # [REQUIRED] Internal squad for FREE plan users
rw_pro_id: "uuid-of-pro-squad"                     # [REQUIRED] Internal squad for PRO plan users
rw_ext_free_id: "uuid-of-ext-free-squad"           # [optional] External squad for FREE users (use if you have external routing)
rw_ext_pro_id: "uuid-of-ext-pro-squad"             # [optional] External squad for PRO users

subscription_url: "https://sub.example.com"        # [optional] Base URL for Remnawave subscription links (used to validate android deep-links)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  DASHBOARD (admin web UI)                                                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

dashboard_login: admin                             # [REQUIRED] Dashboard admin login
dashboard_password: change-me                      # [REQUIRED] Admin password — must NOT be empty or "admin" (boot refuses)
# JWT signing secret. The dashboard REFUSES TO START if this is unset, equal to
# the old built-in default, or shorter than 32 bytes — anyone with a known secret
# can forge admin tokens. Generate one with:  openssl rand -hex 32
dashboard_secret: change-me-to-a-random-string-of-at-least-32-bytes

# Serve Swagger UI (/api/docs) + openapi.json on the dashboard AND miniapp APIs.
# Keep false in production — when true the full API surface (incl. admin/IAP
# routes) is publicly enumerable. Can also be toggled with env EXPOSE_API_DOCS=1.
expose_api_docs: false


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  TELEMT (external server management)                                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

telemt_server: "https://telemt.example.com"        # [optional] Telemt API base URL; omit to disable Telemt features
telemt_header: "your-telemt-auth-header"           # [optional] Authorization header value sent to Telemt


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  FREE PLAN                                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

free_days: 30                                      # [optional] Free plan duration in days (default: 30)
free_traffic: 10                                   # [optional] Free plan traffic limit in GB (default: 10)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ANDROID / MOBILE APP                                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

android_jwt_secret: "change-me-android-jwt-secret" # [REQUIRED for Android API] HS256 signing key for mobile JWTs
# android_access_ttl: 900                          # [optional] Access token TTL in seconds (default: 900 = 15 min)
# android_refresh_ttl: 5184000                     # [optional] Refresh token TTL in seconds (default: 5184000 = 60 days)
# android_jwt_issuer: "xray-vpn-bot"               # [optional] JWT `iss` claim (default: xray-vpn-bot)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  EMAIL (SMTP for verification codes)                                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

smtp_host: "smtp.example.com"                      # [REQUIRED for email] SMTP server host
smtp_port: 587                                     # [optional] SMTP port (default: 587 / STARTTLS; use 465 for implicit TLS)
smtp_user: "noreply@example.com"                   # [REQUIRED for email] SMTP login
smtp_password: "your-smtp-password"                # [REQUIRED for email] SMTP password
# smtp_from: "YourVPN <noreply@example.com>"       # [optional] Sender display name + address; defaults to smtp_user
# smtp_use_tls: false                              # [optional] true = implicit TLS on port 465; false = STARTTLS (auto-detected from port)
# email_code_ttl: 900                              # [optional] Verification code TTL in seconds (default: 900 = 15 min)
# email_code_max_attempts: 5                       # [optional] Max failed attempts before code is invalidated (default: 5)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  GOOGLE PLAY (in-app purchases — Android only)                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# Leave all three blank to disable Google Play IAP entirely.
google_play_package_name: ""                       # e.g. com.example.xrayvpn — must match Play Console
google_play_service_account_path: ""               # Container-side path to the service-account JSON file
google_play_rtdn_token: ""                         # Shared secret for Play RTDN push endpoint (strongly recommended)


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  WEB PORTAL (CORS)                                                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# Allowed origins for the external web portal frontend (miniapp service).
# Omit or leave empty to allow all origins (development only).
# web_allowed_origins:
#   - https://web.yourdomain.com

# Telegram OpenID Connect (Login 2.0) — enables "Sign in with Telegram" on the web portal.
# 1. In BotFather: /mybots → your bot → Bot Settings → Web Login → Set Domain → yourdomain.com
# 2. BotFather → the same menu → Client Secret → copy the value here.
# 3. Set VITE_TG_BOT_ID in GitHub Actions Variables to your bot's numeric ID.
# Leave empty to hide the Telegram login button on the portal.
tg_client_secret: ""


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  SUPPORT BOT (legacy standalone bot — support.py)                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

support_token: "yoursupportbottoken"               # [optional] Token for the legacy support.py bot; omit if not using it


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PAYMENT GATEWAY: TELEGRAM STARS + CRYPTOBOT                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

crypto_bot_token: "your_cryptobot_api_token"       # CryptoBot (@CryptoBot) API token — enables USDT/Stars invoices


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PAYMENT GATEWAY: CRYSTAL PAY                                               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

crystal_login: "your_crystal_login"
crystal_secret: "your_crystal_secret"
crystal_salt: "your_crystal_salt"
crystal_webhook: "https://example.com:5000/crystal_webhook"  # Must be reachable from Crystal Pay servers


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PAYMENT GATEWAY: A-PAYS (SBP)                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apay_id: 1234                                      # A-Pays merchant ID
apay_secret: "your_apay_secret"                    # A-Pays secret key
apay_api_url: "https://apays.io"                   # A-Pays API base URL


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PAYMENT GATEWAY: PLATEGA                                                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

platega_merchant_id: "your-platega-merchant-uuid"  # Platega merchant UUID (X-MerchantId header)
platega_api_key: "your_platega_api_key"            # Platega API key (X-Secret header)
platega_url: "https://app.platega.io"              # Platega API base URL
platega_payment_method: 2                          # 2=SBP · 3=ERIP · 11=card · 12=intl · 13=crypto


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  PAYMENT GATEWAY: PARITYPAY                                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

paritypay_shop_id: "your-paritypay-shop-uuid"      # ParityPay cassa (shop) UUID sent in every request
paritypay_secret_1: "your_paritypay_secret_key_1"  # Secret key №1 — signs outgoing API requests (X-SIGNATURE)
paritypay_secret_2: "your_paritypay_secret_key_2"  # Secret key №2 — verifies incoming webhooks
paritypay_url: "https://api.paritypay.ru"          # ParityPay API base URL
paritypay_webhook: ""                              # [optional] Public URL of /bot/paritypay_webhook; blank → set it in the ParityPay cassa settings
paritypay_service: "sbp"                            # Default service when a node's method is unset: sbp or card


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  CURRENCY RATES (dashboard — optional overrides)                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# The dashboard fetches USD/RUB from the CBR API automatically.
# Set these to override the live rate (e.g. in air-gapped environments).
# star_rub_rate: 1.3                               # Telegram Stars → RUB (default: 1.3)
# usd_rub_rate: 90.0                               # USD → RUB fallback when CBR is unreachable


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  STORE (external product store — dashboard)                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# Omit both keys to disable the Store section in the dashboard.
# store_url: "https://store.example.com"
# store_api_token: "your-store-api-token"


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  LEGACY BOT CONSTRUCTOR PRICES                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# Only used when legacy_bot_constructor = true in Dashboard → WebApp → Settings.
# When disabled, users are directed to the MiniApp and these values are ignored.
# After enabling, restart the bot for prices to take effect.

stars_price: 150                                   # 1-month base price in Telegram Stars
crypto_price: 2                                    # 1-month base price in USDT
sbp_price: 150                                     # 1-month base price in RUB (SBP / Crystal / A-Pays)
discount: 5                                        # Extra discount (%) applied to 3+ month plans


