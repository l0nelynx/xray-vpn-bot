name: Bump and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump, or republish the current release
        required: true
        type: choice
        default: patch
        options:
          - current
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: bump
        shell: bash
        run: |
          set -euo pipefail

          BUMP="${{ github.event.inputs.bump }}"
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          BASE="${CURRENT%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          case "$BUMP" in
            current) ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump type: $BUMP" >&2; exit 1 ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEW_VERSION}"

          if [[ "$BUMP" == "current" ]]; then
            if ! git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
              echo "Tag $TAG does not exist and cannot be republished" >&2
              exit 1
            fi
          else
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists" >&2
              exit 1
            fi

            printf '%s\n' "$NEW_VERSION" > VERSION
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "chore: release ${TAG}"
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin main
            git push origin "$TAG"
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  meta:
    needs: bump
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ needs.bump.outputs.version }}"
            TAG="${{ needs.bump.outputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi

          if [[ -z "$VERSION" || -z "$TAG" ]]; then
            echo "Could not resolve release version" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  publish:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: refs/tags/${{ needs.meta.outputs.tag }}
      release_version: ${{ needs.meta.outputs.version }}
      publish: true
    secrets: inherit

  release:
    needs: [meta, publish]
    runs-on: ubuntu-latest
    steps:

      - name: Skip if GitHub Release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ needs.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ needs.meta.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Release ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Container images

            Tag `${{ needs.meta.outputs.version }}` is published to GHCR and Docker Hub for all services.

            | Service | Pull (GHCR) | Pull (Docker Hub) |
            |---------|-------------|-------------------|
            | bot | `ghcr.io/${{ github.repository_owner }}/bot:${{ needs.meta.outputs.version }}` | `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bot:${{ needs.meta.outputs.version }}` |
            | support-bot | `ghcr.io/${{ github.repository_owner }}/support-bot:${{ needs.meta.outputs.version }}` | `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/support-bot:${{ needs.meta.outputs.version }}` |
            | dashboard | `ghcr.io/${{ github.repository_owner }}/dashboard:${{ needs.meta.outputs.version }}` | `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dashboard:${{ needs.meta.outputs.version }}` |
            | miniapp | `ghcr.io/${{ github.repository_owner }}/miniapp:${{ needs.meta.outputs.version }}` | `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/miniapp:${{ needs.meta.outputs.version }}` |
            | frontend | `ghcr.io/${{ github.repository_owner }}/frontend:${{ needs.meta.outputs.version }}` | `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ needs.meta.outputs.version }}` |
            | python-base | `ghcr.io/${{ github.repository_owner }}/python-base:${{ needs.meta.outputs.version }}` | `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/python-base:${{ needs.meta.outputs.version }}` |

            **Deploy:** set `IMAGE_TAG=${{ needs.meta.outputs.version }}` in `.env` and run `docker compose pull`.
