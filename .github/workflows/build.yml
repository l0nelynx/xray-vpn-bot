name: Docker CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [develop]
    paths-ignore: ['docs/**', '**.md']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Promote verified images to the branch environment tag
        type: boolean
        default: false
      refresh:
        description: Reinstall OS and Python dependencies without build cache
        type: boolean
        default: true
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact sources to publish
        type: string
        default: ''
      release_version:
        description: Release version without v; forces a full build
        type: string
        default: ''
      publish:
        description: Publish verified images
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || inputs.checkout_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      publish: ${{ steps.mode.outputs.publish }}
      refresh: ${{ steps.mode.outputs.refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Resolve build mode
        id: mode
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REQUESTED_REFRESH: ${{ inputs.refresh }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$REQUESTED_PUBLISH" == true || "$EVENT_NAME" == schedule || ( "$EVENT_NAME" == push && "$REF" == refs/heads/develop ) ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" == schedule || "$REQUESTED_REFRESH" == true ]]; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
          else
            echo 'refresh=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$RELEASE_VERSION" || "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'all=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: steps.mode.outputs.all != 'true'
        with:
          filters: |
            meta:
              - '.github/**'
              - '.dockerignore'
              - 'docker-bake.hcl'
              - 'scripts/ci/**'
              - 'VERSION'
            base:
              - 'infra/docker/base.Dockerfile'
              - 'infra/docker/requirements-base.txt'
              - 'infra/docker/constraints.*'
              - 'packages/common_db/**'
              - 'packages/remnawave_client/**'
            shared:
              - 'packages/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'migrations_runner.py'
            bot:
              - 'services/bot/**'
              - 'infra/docker/bot.Dockerfile'
            support_bot:
              - 'services/support_bot/**'
              - 'infra/docker/support_bot.Dockerfile'
              - 'infra/docker/constraints.*'
            dashboard:
              - 'services/dashboard/**'
              - 'infra/docker/dashboard.Dockerfile'
            miniapp:
              - 'services/miniapp/**'
              - 'infra/docker/miniapp.Dockerfile'
            frontend:
              - 'web/**'
              - 'package*.json'
              - 'infra/docker/frontend.*'
              - 'services/miniapp/backend/connect/app_config.default.json'
      - name: Select affected images
        id: select
        env:
          ALL: ${{ steps.mode.outputs.all }}
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          python3 - <<'PY'
          import json, os
          filters = json.loads(os.environ['FILTERS'])
          changed = lambda name: filters.get(name) == 'true'
          all_images = os.environ['ALL'] == 'true' or changed('meta')
          backends = all_images or changed('base') or changed('shared')
          selected = [name for name in ['python-base', 'bot', 'support-bot', 'dashboard', 'miniapp', 'frontend']
                      if all_images or changed(name.replace('-', '_'))
                      or (name == 'python-base' and changed('base'))
                      or (name in {'bot', 'dashboard', 'miniapp'} and backends)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(selected) + '\n')
          PY

  checks:
    uses: ./.github/workflows/checks.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.ref }}

  version:
    runs-on: ubuntu-latest
    outputs:
      tags_meta: ${{ steps.calc.outputs.tags_meta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - id: calc
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          TAGS_META=""
          add_tag() { TAGS_META+="type=raw,value=${1}"$'\n'; }
          if [[ -n "$RELEASE_VERSION" ]]; then
            add_tag "$RELEASE_VERSION"
            add_tag "${RELEASE_VERSION%.*}"
            add_tag "${RELEASE_VERSION%%.*}"
            add_tag latest
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            add_tag "pr-${PR_NUMBER}"
          elif [[ "$REF" == refs/heads/develop ]]; then
            add_tag "${VERSION}.${BUILD}"
            add_tag staging
          elif [[ "$REF" == refs/heads/main ]]; then
            # Scheduled rebuilds never replace immutable semver release tags.
            add_tag "security-${BUILD}"
            add_tag latest
          else
            # Manual validation on a feature branch is allowed without publication.
            add_tag "check-${BUILD}"
          fi
          add_tag "sha-${SHORT_SHA}"
          { echo 'tags_meta<<EOF'; printf '%s' "$TAGS_META"; echo EOF; } >> "$GITHUB_OUTPUT"

  build:
    needs: [detect, version, checks]
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: ./.github/actions/docker-build
        with:
          service: ${{ matrix.service }}
          tags_meta: ${{ needs.version.outputs.tags_meta }}
          ghcr_owner: ${{ github.repository_owner }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          push: ${{ needs.detect.outputs.publish }}
          refresh: ${{ needs.detect.outputs.refresh }}

  ci:
    name: CI passed
    if: always()
    needs: [detect, version, checks, build]
    runs-on: ubuntu-latest
    env:
      DETECT: ${{ needs.detect.result }}
      VERSION: ${{ needs.version.result }}
      CHECKS: ${{ needs.checks.result }}
      BUILD: ${{ needs.build.result }}
    steps:
      - run: |
          [[ "$DETECT" == success && "$VERSION" == success && "$CHECKS" == success ]]
          [[ "$BUILD" == success || "$BUILD" == skipped ]]
