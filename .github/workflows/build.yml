# .github/workflows/build.yml
name: Build and Push Docker

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  detect:
    if: "!startsWith(github.event.head_commit.message, 'docs:')"
    runs-on: ubuntu-latest
    outputs:
      bot:         ${{ steps.filter.outputs.bot }}
      support_bot: ${{ steps.filter.outputs.support_bot }}
      dashboard:   ${{ steps.filter.outputs.dashboard }}
      miniapp:     ${{ steps.filter.outputs.miniapp }}
      frontend:    ${{ steps.filter.outputs.frontend }}
      base:        ${{ steps.filter.outputs.base }}
      shared:      ${{ steps.filter.outputs.shared }}
      meta:        ${{ steps.filter.outputs.meta }}
      release:     ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'migrations_runner.py'

            base:
              - 'infra/docker/base.Dockerfile'
              - 'infra/docker/requirements-base.txt'
              - 'packages/common_db/**'
              - 'packages/remnawave_client/**'

            meta:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'VERSION'

            bot:
              - 'services/bot/**'
              - 'infra/docker/bot.Dockerfile'

            support_bot:
              - 'services/support_bot/**'
              - 'infra/docker/support_bot.Dockerfile'

            dashboard:
              - 'services/dashboard/**'
              - 'infra/docker/dashboard.Dockerfile'

            miniapp:
              - 'services/miniapp/**'
              - 'infra/docker/miniapp.Dockerfile'

            frontend:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'infra/docker/frontend.Dockerfile'
              - 'infra/docker/frontend.nginx.conf'

  version:
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      tags_meta: ${{ steps.calc.outputs.tags_meta }}
      base_tag:  ${{ steps.calc.outputs.base_tag }}
      base_pull_tag: ${{ steps.calc.outputs.base_pull_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: calc
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          REF="${{ github.ref }}"

          TAGS_META=""
          add_tag() {
            TAGS_META+="type=raw,value=${1}"$'\n'
          }

          if [[ "$REF" == refs/tags/v* ]]; then
            VER="${REF#refs/tags/v}"
            MINOR="${VER%.*}"
            MAJOR="${VER%%.*}"
            BASE_TAG="$VER"
            BASE_PULL_TAG="latest"
            add_tag "$VER"
            add_tag "$MINOR"
            add_tag "$MAJOR"
            add_tag "latest"
          elif [[ "$REF" == refs/heads/main ]]; then
            BASE_TAG="latest"
            BASE_PULL_TAG="latest"
            add_tag "$VERSION"
            add_tag "latest"
          elif [[ "$REF" == refs/heads/develop ]]; then
            BASE_TAG="staging"
            BASE_PULL_TAG="staging"
            add_tag "${VERSION}.${BUILD}"
            add_tag "staging"
          else
            echo "Unsupported ref: $REF" >&2
            exit 1
          fi

          add_tag "sha-${SHORT_SHA}"

          {
            echo "base_tag=${BASE_TAG}"
            echo "base_pull_tag=${BASE_PULL_TAG}"
            echo "tags_meta<<EOF"
            printf '%s' "$TAGS_META"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-base:
    needs: [detect, version]
    if: needs.detect.outputs.base == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          service: python-base
          dockerfile: ./infra/docker/base.Dockerfile
          context: ./
          tags_meta: ${{ needs.version.outputs.tags_meta }}
          ghcr_owner: ${{ github.repository_owner }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Release tags list python-base:<version>; when base inputs did not change,
  # point version tags at the already-published moving tag without rebuilding.
  retag-base:
    needs: [detect, version, build-base]
    if: >-
      ${{ !cancelled()
          && needs.detect.outputs.release == 'true'
          && needs.detect.outputs.base != 'true'
          && needs['build-base'].result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag python-base for release
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REF: ${{ github.ref }}
          BASE_PULL_TAG: ${{ needs.version.outputs.base_pull_tag }}
        run: |
          set -euo pipefail

          VER="${REF#refs/tags/v}"
          MINOR="${VER%.*}"
          MAJOR="${VER%%.*}"

          retag() {
            local registry="$1" image="$2"
            local source="${registry}/${image}:${BASE_PULL_TAG}"
            docker buildx imagetools create \
              -t "${registry}/${image}:${VER}" \
              -t "${registry}/${image}:${MINOR}" \
              -t "${registry}/${image}:${MAJOR}" \
              "${source}"
          }

          retag "ghcr.io/${GHCR_OWNER}" "python-base"
          retag "docker.io/${DH_USER}" "python-base"

  build-bot:
    needs: [detect, version, build-base]
    if: >-
      ${{ !cancelled()
          && needs.detect.result == 'success'
          && needs['build-base'].result != 'failure'
          && (needs.detect.outputs.release == 'true'
              || needs.detect.outputs.bot == 'true'
              || needs.detect.outputs.shared == 'true'
              || needs.detect.outputs.base == 'true'
              || needs.detect.outputs.meta == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          service: bot
          dockerfile: ./infra/docker/bot.Dockerfile
          context: ./
          tags_meta: ${{ needs.version.outputs.tags_meta }}
          ghcr_owner: ${{ github.repository_owner }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          base_image: ghcr.io/${{ github.repository_owner }}/python-base:${{ needs.build-base.result == 'success' && needs.version.outputs.base_tag || needs.version.outputs.base_pull_tag }}

  build-support-bot:
    needs: [detect, version]
    if: |
      needs.detect.outputs.release == 'true' ||
      needs.detect.outputs.support_bot == 'true' ||
      needs.detect.outputs.meta == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          service: support-bot
          dockerfile: ./infra/docker/support_bot.Dockerfile
          context: ./
          tags_meta: ${{ needs.version.outputs.tags_meta }}
          ghcr_owner: ${{ github.repository_owner }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  build-dashboard:
    needs: [detect, version, build-base]
    if: >-
      ${{ !cancelled()
          && needs.detect.result == 'success'
          && needs['build-base'].result != 'failure'
          && (needs.detect.outputs.release == 'true'
              || needs.detect.outputs.dashboard == 'true'
              || needs.detect.outputs.shared == 'true'
              || needs.detect.outputs.base == 'true'
              || needs.detect.outputs.meta == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          service: dashboard
          dockerfile: ./infra/docker/dashboard.Dockerfile
          context: ./
          tags_meta: ${{ needs.version.outputs.tags_meta }}
          ghcr_owner: ${{ github.repository_owner }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          base_image: ghcr.io/${{ github.repository_owner }}/python-base:${{ needs.build-base.result == 'success' && needs.version.outputs.base_tag || needs.version.outputs.base_pull_tag }}

  build-frontend:
    needs: [detect, version]
    if: |
      needs.detect.outputs.release == 'true' ||
      needs.detect.outputs.frontend == 'true' ||
      needs.detect.outputs.meta == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          service: frontend
          dockerfile: ./infra/docker/frontend.Dockerfile
          context: ./
          tags_meta: ${{ needs.version.outputs.tags_meta }}
          ghcr_owner: ${{ github.repository_owner }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  build-miniapp:
    needs: [detect, version, build-base]
    if: >-
      ${{ !cancelled()
          && needs.detect.result == 'success'
          && needs['build-base'].result != 'failure'
          && (needs.detect.outputs.release == 'true'
              || needs.detect.outputs.miniapp == 'true'
              || needs.detect.outputs.shared == 'true'
              || needs.detect.outputs.base == 'true'
              || needs.detect.outputs.meta == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          service: miniapp
          dockerfile: ./infra/docker/miniapp.Dockerfile
          context: ./
          tags_meta: ${{ needs.version.outputs.tags_meta }}
          ghcr_owner: ${{ github.repository_owner }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          base_image: ghcr.io/${{ github.repository_owner }}/python-base:${{ needs.build-base.result == 'success' && needs.version.outputs.base_tag || needs.version.outputs.base_pull_tag }}
