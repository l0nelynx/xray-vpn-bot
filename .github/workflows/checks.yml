name: Project checks

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: infra/docker/constraints.txt
      - name: Install the locked test environment
        run: |
          python -m pip install -c infra/docker/constraints.txt --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -r requirements-dev.txt
          python -m pip check
      - name: Test all services and shared packages
        run: python -m pytest -q
      - name: Audit the Python lock
        run: pip-audit -r infra/docker/constraints.txt --no-deps --disable-pip

  npm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Audit all locked npm dependencies, including build tooling
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
