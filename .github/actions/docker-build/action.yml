name: Build Docker image
description: Build a service image and optionally publish it to GHCR and Docker Hub.

inputs:
  service:
    description: Image name (e.g. bot, python-base)
    required: true
  dockerfile:
    description: Path to Dockerfile
    required: true
  context:
    description: Build context
    required: false
    default: ./
  tags_meta:
    description: Multiline tag definitions for docker/metadata-action (type=raw,...)
    required: true
  ghcr_owner:
    description: GHCR namespace (usually github.repository_owner)
    required: false
  dockerhub_username:
    description: Docker Hub namespace
    required: false
  dockerhub_token:
    description: Docker Hub access token
    required: false
  push:
    description: Whether to authenticate and publish the image
    required: false
    default: 'false'
  base_image:
    description: Optional BASE_IMAGE build-arg for backend Dockerfiles
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Log in to Docker Hub
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Docker metadata
      id: meta
      if: inputs.push == 'true'
      uses: docker/metadata-action@v6

      with:
        images: |
          ghcr.io/${{ inputs.ghcr_owner }}/${{ inputs.service }}
          docker.io/${{ inputs.dockerhub_username }}/${{ inputs.service }}
        tags: ${{ inputs.tags_meta }}

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.push == 'true' && steps.meta.outputs.tags || format('local/{0}:check', inputs.service) }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,mode=${{ inputs.push == 'true' && 'max' || 'min' }},scope=${{ inputs.service }}
        provenance: ${{ inputs.push == 'true' }}
        build-args: |
          BASE_IMAGE=${{ inputs.base_image }}
