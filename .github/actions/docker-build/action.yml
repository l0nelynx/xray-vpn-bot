name: Build and push Docker image
description: Login to GHCR and Docker Hub, build and push a service image.

inputs:
  service:
    description: Image name (e.g. bot, python-base)
    required: true
  dockerfile:
    description: Path to Dockerfile
    required: true
  context:
    description: Build context
    required: false
    default: ./
  tags_meta:
    description: Multiline tag definitions for docker/metadata-action (type=raw,...)
    required: true
  ghcr_owner:
    description: GHCR namespace (usually github.repository_owner)
    required: true
  dockerhub_username:
    description: Docker Hub namespace
    required: true
  dockerhub_token:
    description: Docker Hub access token
    required: true
  base_image:
    description: Optional BASE_IMAGE build-arg for backend Dockerfiles
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ inputs.ghcr_owner }}/${{ inputs.service }}
          docker.io/${{ inputs.dockerhub_username }}/${{ inputs.service }}
        tags: ${{ inputs.tags_meta }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ inputs.base_image }}
