stages: [check, build]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      changes:
        - services/**/*
        - packages/**/*
        - web/**/*
        - infra/**/*
        - scripts/**/*
        - tests/**/*
        - alembic/**/*
        - alembic.ini
        - migrations_runner.py
        - package*.json
        - requirements-dev.txt
        - pyproject.toml
        - VERSION
        - docker-bake.hcl
        - .dockerignore
        - .gitlab-ci.yml

check-python:
  stage: check
  image: python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
  variables:
    CONFIG_PATH: $CI_PROJECT_DIR/config-example.yml
    DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key:
      files: [infra/docker/constraints.txt]
    paths: [.cache/pip]
  script:
    - apk add --no-cache gcc musl-dev postgresql-dev cairo pango gdk-pixbuf libffi
    - python -m pip install -c infra/docker/constraints.txt --upgrade pip setuptools wheel
    - python -m pip install --no-build-isolation -r requirements-dev.txt
    - python -m pip check
    - python -m pytest -q
    - pip-audit -r infra/docker/constraints.txt --no-deps --disable-pip

check-npm:
  stage: check
  image: node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
  script:
    - npm audit --package-lock-only --ignore-scripts --audit-level=high

build:
  stage: build
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - name: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: '1'
  parallel:
    matrix:
      - NAME: [python-base, bot, support-bot, dashboard, miniapp, frontend]
  before_script:
    - apk add --no-cache bash python3
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --driver docker-container --use --bootstrap
  script:
    - bash scripts/ci/gitlab-build.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [trivy-*.json]
